[project]
name = "lazarus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "brainwidemap",
    "cebra>=0.6.1",
    "iblatlas>=1.3.0",
    "ibllib>=4.0.1",
    "matplotlib>=3.9",
    "one-api>=3.6.1",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lazarus"]

[tool.uv.sources]
brainwidemap = { git = "https://github.com/int-brain-lab/paper-brain-wide-map.git", rev = "705b7cb" }
