[project]
name = "backend"
version = "0.1.0"
description = "Research Tracker v0 backend: FastAPI API and CEBRA worker"
requires-python = ">=3.11"
dependencies = [
    "cebra>=0.6.1",
    "fastapi>=0.163.2",
    "ibllib>=4.1.1",
    "numpy>=1.26.4",
    "one-api>=3.6.2",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
